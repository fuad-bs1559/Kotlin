moshi = "com.squareup.moshi:moshi:1.15.1"
moshi-kotlin = "com.squareup.moshi:moshi-kotlin:1.14.0"
kotlin-coroutines-adapter = "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2"
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
navigation-safe-args = {id = "androidx.navigation.safeargs.kotlin" , version = "2.8.6"}
